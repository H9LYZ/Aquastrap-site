<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquastrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#04070d; --blue:#27b6ff; --ice:#eaf9ff; --muted:#7f93ad; --line:#1a2b45; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse 90% 55% at 50% -12%, #0d1f3d 0%, transparent 70%),
      var(--bg);
    color:var(--ice);
    font-family:"Barlow","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  #sky{position:fixed; inset:0; z-index:0; pointer-events:none}
  main{position:relative; z-index:1; text-align:center; padding:24px; width:100%}

  h1{
    font-family:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
    font-weight:900; font-size:clamp(3.6rem,19vw,8rem); line-height:.88; letter-spacing:.01em;
    color:#16294a; -webkit-text-stroke:1px #3a6199;
    transition:color .6s ease-out, text-shadow .6s ease-out, -webkit-text-stroke-color .6s ease-out;
  }
  h1.lit{
    color:var(--ice); -webkit-text-stroke-color:#a6e6ff; transition:none;
    text-shadow:0 0 14px rgba(39,182,255,.95), 0 0 56px rgba(20,105,255,.75);
  }
  p.sub{color:var(--muted); font-size:1.05rem; font-weight:500; margin-top:14px}

  .actions{display:flex; gap:12px; justify-content:center; margin-top:34px; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 26px; border-radius:6px; font:600 1rem "Barlow","Segoe UI",sans-serif;
    text-decoration:none; transition:background .15s, border-color .15s, transform .15s;
  }
  .btn svg{width:20px; height:20px; flex:none}
  .btn.primary{background:var(--blue); color:#02111f}
  .btn.primary:hover{background:var(--ice); transform:translateY(-2px)}
  .btn.ghost{border:1px solid var(--line); color:var(--ice); background:rgba(8,16,30,.6)}
  .btn.ghost:hover{border-color:var(--blue); transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--ice); outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.btn,h1{transition:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <h1 id="title">Aquastrap</h1>
  <p class="sub">A Roblox Linux Fast Flag Editor</p>
  <div class="actions">
    <a class="btn primary" href="https://github.com/dime-scripts/Aquastrap" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
      Download
    </a>
    <a class="btn ghost" href="https://discord.gg/c6HTvDVsnf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
      Join Discord
    </a>
  </div>
</main>

<script>
(() => {
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  const title = document.getElementById('title');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H;
  const rand = (a, b) => a + Math.random() * (b - a);

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // midpoint displacement -> jagged line
  function jag(x0, y0, x1, y1, rough, depth) {
    let pts = [[x0, y0], [x1, y1]];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
        next.push(pts[i], [(ax + bx) / 2 + rand(-rough, rough), (ay + by) / 2 + rand(-rough * .3, rough * .3)]);
      }
      next.push(pts[pts.length - 1]);
      pts = next; rough *= 0.55;
    }
    return pts;
  }

  function makeBolt(x0, y0, x1, y1) {
    const len = Math.hypot(x1 - x0, y1 - y0);
    const main = jag(x0, y0, x1, y1, len * 0.16, 7);
    const branches = [];
    for (let i = 4; i < main.length - 4; i++) {
      if (Math.random() < 0.06) {
        const [sx, sy] = main[i];
        const ang = Math.PI / 2 + (Math.random() < .5 ? -1 : 1) * rand(.3, .95);
        const l = rand(50, H * 0.2);
        const br = jag(sx, sy, sx + Math.cos(ang) * l, sy + Math.sin(ang) * l, l * 0.22, 5);
        const sub = [];
        if (Math.random() < .5) {
          const j = br[Math.floor(br.length / 2)];
          sub.push(jag(j[0], j[1], j[0] + rand(-60, 60), j[1] + rand(30, 90), 12, 4));
        }
        branches.push(br, ...sub);
      }
    }
    return { main, branches };
  }

  function line(pts) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  }

  function drawBolt(b, a) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter';
    const passes = [
      [`rgba(20,105,255,${.55 * a})`, 9, 26],
      [`rgba(39,182,255,${.95 * a})`, 3.2, 12],
      [`rgba(235,250,255,${a})`, 1.5, 4]
    ];
    for (const [col, w, blur] of passes) {
      ctx.strokeStyle = col; ctx.shadowColor = `rgba(39,182,255,${a})`; ctx.shadowBlur = blur;
      ctx.lineWidth = w; line(b.main);
      ctx.lineWidth = w * .45;
      for (const br of b.branches) line(br);
    }
    ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  }

  // flicker curve: hard hit, dip, second hit, slow fade (ms)
  function intensity(t) {
    if (t < 70) return 1;
    if (t < 120) return .2;
    if (t < 210) return 1;
    if (t < 260) return .35;
    if (t < 330) return .8;
    return Math.max(0, .5 * Math.exp(-(t - 330) / 150));
  }

  const strikes = [];
  let running = false;

  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    for (let i = strikes.length - 1; i >= 0; i--) {
      const s = strikes[i], t = now - s.t0, a = intensity(t);
      if (t > 1100) { strikes.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(110,185,255,${a * 0.09})`;
      ctx.fillRect(0, 0, W, H);
      drawBolt(s.bolt, a);
    }
    if (strikes.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  function strike(x1, y1) {
    const x0 = x1 + rand(-0.12, 0.12) * H;
    strikes.push({ bolt: makeBolt(x0, -10, x1, y1), t0: performance.now() });
    title.classList.add('lit');
    setTimeout(() => title.classList.remove('lit'), 420);
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  function strikeTitle() {
    const r = title.getBoundingClientRect();
    strike(rand(r.left + r.width * .15, r.right - r.width * .15), r.top + r.height * .25);
  }

  function loop() {
    strikeTitle();
    if (Math.random() < .3) setTimeout(strikeTitle, rand(180, 320)); // occasional double strike
    setTimeout(loop, rand(4500, 9000));
  }

  size();
  addEventListener('resize', size);

  if (reduced) {
    // one static, faint bolt, no animation
    const r = title.getBoundingClientRect();
    drawBolt(makeBolt(W / 2 + 20, -10, W / 2, r.top + r.height * .25), .35);
  } else {
    // tap/click anywhere: lightning hits that spot
    addEventListener('pointerdown', e => {
      if (e.target.closest('a')) return;
      strike(e.clientX, e.clientY);
    });
    setTimeout(loop, 700);
  }
})();
</script>
</body>
</html>
